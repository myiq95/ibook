name: Build IPA for SideStore
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          rm -rf ./build ./ReaderApp/build
          xcodebuild -project ReaderApp/ReaderApp.xcodeproj -scheme ReaderTTS -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=./build/symroot OBJROOT=./build/objroot build
          find . -name "ReaderTTS.app" -type d -print
      - name: Package IPA
        run: |
          APP=$(find . -name "ReaderTTS.app" -type d | head -n 1)
          echo "Found APP at $APP"
          ls -lh "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r ReaderTTS-SideStore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ReaderTTS-IPA
          path: ReaderTTS-SideStore.ipa
